app = 'hv-skills'
primary_region = 'sjc'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '256mb'
  memory_mb = 256
  size = 'shared-cpu-1x'
